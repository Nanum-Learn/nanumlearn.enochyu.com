{{ with site.Params.comments }}
<section class="block comments mathjax_ignore tex2jax_ignore" id="comments" data-api="{{ .api }}" data-site="{{ .site }}" data-path="{{ $.RelPermalink }}" data-sitekey="{{ .turnstile }}">
  <h2>Comments</h2>
  <noscript><p class="comments-note">Comments need JavaScript.</p></noscript>
</section>
{{ $comments := resources.Get "js/comments.js" }}
<script src="{{ $comments.RelPermalink }}" defer></script>
{{ end }}
