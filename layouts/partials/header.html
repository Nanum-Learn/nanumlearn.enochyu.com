<div class="banner" id="banner" hidden>
  We are still in beta! Please feel free to explore and leave
  any feedback through our <a href="{{ .Site.Params.social.discord }}" target="_blank" rel="noopener">discord server</a> :))
  <button type="button" aria-label="Close">&#x2715;</button>
</div>
<header class="nav">
  <nav class="wrap nav-inner">
    <a href="/" class="nav-logo"><img src="/logo/logo-inline.svg" alt="Nanum Learn" width="1000" height="365"></a>
    <button type="button" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span><span></span></button>
    <ul class="nav-menu">
      {{ range slice "books" "handouts" "classes" "news" "about" }}
      <li><a href="/{{ . }}/"{{ if eq $.Section . }} aria-current="page"{{ end }}>{{ title . }}</a></li>
      {{ end }}
    </ul>
  </nav>
</header>
