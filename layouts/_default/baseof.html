<!DOCTYPE html>
<html lang="{{ .Language.Params.locale | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}

  <main>
    {{ block "main" . }}{{ end }}
  </main>
  
  {{ partial "footer.html" . }}
  {{ partial "popup.html" . }}

  {{ $script := resources.Get "js/script.js" }}
  <script src="{{ $script.RelPermalink }}"></script>
  {{ $counter := resources.Get "js/counter.js" }}
  <script src="{{ $counter.Permalink }}"></script>
</body>
</html>
