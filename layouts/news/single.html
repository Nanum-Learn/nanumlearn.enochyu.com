{{ define "main" }}
<article class="wrap narrow post">
  <header class="post-head">
    <p class="eyebrow">News</p>
    <h1>{{ .Title }}</h1>
    <p class="meta">{{ .Params.author }} · {{ .Date.Format "January 2, 2006" }} · {{ .ReadingTime }} min read · {{ .WordCount }} words</p>
  </header>
  <div class="prose">{{ .Content }}</div>
  {{ partial "comments.html" . }}
  {{ partial "pager.html" . }}
</article>
{{ end }}
