{{ define "main" }}
{{ partial "page-head.html" . }}
<section class="section">
  <div class="wrap">
    {{ range .RegularPages.GroupByDate "2006" }}
    <h2 class="year">{{ .Key }}</h2>
    <ul class="rows">
      {{ range .Pages }}
      <li><a href="{{ .RelPermalink }}"><span>{{ .Title }}</span><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></a></li>
      {{ end }}
    </ul>
    {{ end }}
  </div>
</section>
{{ end }}
